<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sentiment Predictor</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
    input, button { padding: 10px; font-size: 16px; width: 100%; margin-top: 10px; }
    #result { margin-top: 20px; font-size: 18px; }
  </style>
</head>
<body>

  <h2>Sentiment Predictor</h2>

  <input id="textInput" type="text" placeholder="Type a sentence..." />

  <button onclick="predict()">Predict Sentiment</button>

  <div id="result"></div>

  <script>
    async function predict() {
      const text = document.getElementById("textInput").value;

      const response = await fetch("https://fastapi-ml-service-brm3.onrender.com/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });

      const data = await response.json();

      document.getElementById("result").innerHTML = `
        <strong>Prediction:</strong> ${data.prediction}<br>
        <strong>Confidence:</strong> ${data.confidence}
      `;
    }
  </script>

</body>
</html>
