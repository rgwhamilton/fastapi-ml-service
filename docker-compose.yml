

version: "3.9"

services:
    api:
        build: .
        container_name: sentiment-api
        ports:
            - "8000:8000"
        restart: always
    prometheus:
        image: prom/prometheus
        container_name: prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        depends_on:
            - api
